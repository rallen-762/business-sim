{% extends "base.html" %}
{% block title %}Sandbox{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h2>Sandbox Mode</h2>
  <p class="help-text">Practice on your own against the bots, or run an unattended balance test. Separate password from the teacher login.</p>
  <form method="post">
    <label for="password">Sandbox Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn full" style="margin-top:18px;" type="submit">Enter Sandbox</button>
  </form>
  <p class="help-text" style="margin-top:16px;">
    <a href="{{ url_for('auth.game_code_entry') }}">Back to the game code screen</a>
  </p>
</div>
{% endblock %}
