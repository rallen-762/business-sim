{% extends "base.html" %}
{% block title %}Log In -- {{ firm.team_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;text-align:center;">
  {% if firm.avatar %}<img class="avatar-thumb" style="width:64px;height:64px;" src="{{ url_for('static', filename='img/avatars/' ~ firm.avatar) }}" alt="">{% endif %}
  <h2>{{ firm.team_name }}</h2>
  <form method="post">
    <label for="password" style="text-align:left;">Team Password</label>
    <input type="password" id="password" name="password" required autofocus>
    <button class="btn accent full" style="margin-top:18px;" type="submit">Log In</button>
  </form>
  <p class="help-text" style="margin-top:16px;"><a href="{{ url_for('auth.slot_list', world_id=firm.world_id) }}">&larr; back to team list</a></p>
</div>
{% endblock %}
